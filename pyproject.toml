[project]
name = "visuaslide"
version = "0.2.0"
description = "A Python SDK and CLI for reproducible survey analysis and Google Slides reporting."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "duckdb",
    "google-api-python-client",
    "google-auth-oauthlib",
    "pandas",
    "pyarrow",
    "pydantic",
    "typer",
]

[project.scripts]
visuaslide = "visuaslide.cli:main"

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/visuaslide"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
