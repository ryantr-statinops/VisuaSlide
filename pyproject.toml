[project]
name = "visuaslide"
version = "0.1.0"
description = "A Python SDK and CLI for reproducible survey analysis and Google Slides reporting."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/visuaslide"]
